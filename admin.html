<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | أعمال المستقبل</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="demo-bar">نسخة تجريبية ببيانات وهمية. لا تدخل بيانات عملاء حقيقية قبل ربط الخادم وتفعيل تسجيل الدخول.</div>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><span class="mark">F</span><div><b>أعمال المستقبل</b><small>لوحة الإدارة</small></div></div>
    <nav>
      <button class="nav-btn active" data-view="requests"><i>▤</i> الطلبات <em id="cnt-new"></em></button>
      <button class="nav-btn" data-view="clients"><i>◉</i> العملاء</button>
      <button class="nav-btn" data-view="board"><i>▥</i> لوحة الحالات</button>
    </nav>
    <div class="side-foot">
      <a href="index.html">← العودة للموقع</a>
      <button id="reset" class="link-btn">إعادة ضبط البيانات التجريبية</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="القائمة">☰</button>
      <h1 id="title">الطلبات</h1>
      <div class="top-tools">
        <input id="q" type="search" placeholder="ابحث بالاسم أو الجوال أو رقم الطلب">
        <button class="btn" id="export">تصدير CSV</button>
      </div>
    </header>
    <section class="kpis" id="kpis"></section>
    <div class="chips-row" id="chips"></div>
    <section id="view"></section>
  </main>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-in" id="drawer-in"></div></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
